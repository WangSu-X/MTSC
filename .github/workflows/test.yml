name: Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}-${{ matrix.python-version }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Install PyTorch CPU version for lighter CI
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        # Install vLLM (required for config types and KV cache interfaces)
        pip install vllm
        # Install test dependencies
        pip install pytest pytest-asyncio msgspec pyzmq
        # Install MTSC in editable mode
        pip install -e .
    
    - name: Run unit tests
      run: |
        pytest tests/ -v --tb=short
